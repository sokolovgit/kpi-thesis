name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: check.py tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live, fonts, tools
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-plain-generic texlive-lang-cyrillic \
            latexmk poppler-utils ttf-mscorefonts-installer fontconfig
          fc-cache -f
          fc-list | grep -q "Times New Roman" && fc-list | grep -q "Courier New"
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just test
