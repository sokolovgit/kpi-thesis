name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: check.py tests
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live, fonts, tools
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-plain-generic texlive-lang-cyrillic texlive-bibtex-extra biber \
            latexmk poppler-utils ttf-mscorefonts-installer fontconfig
          fc-cache -f
          fc-list | grep -q "Times New Roman" && fc-list | grep -q "Courier New"
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just test

  # Overleaf and Linux without mscorefonts: the class falls back to TeX Gyre and still builds.
  fallback-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live without Microsoft fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-plain-generic texlive-lang-cyrillic texlive-bibtex-extra biber \
            latexmk fonts-texgyre fontconfig
          ! fc-list | grep -q "Times New Roman"
      - uses: extractions/setup-just@v2
      - run: just install
      - name: Coursework builds on TeX Gyre
        run: |
          just new coursework /tmp/cw
          cd /tmp/cw && just build
          grep -q "TeX Gyre Termes" build/main.log

  # The release artifacts: the Overleaf zip must build on its own, the CTAN zip must hold
  # exactly the package files.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-plain-generic texlive-lang-cyrillic texlive-bibtex-extra biber \
            latexmk fonts-texgyre fontconfig zip unzip
      - uses: extractions/setup-just@v2
      - name: Overleaf zip builds without the installed class
        run: |
          just overleaf
          mkdir /tmp/ovl && cd /tmp/ovl && unzip -q "$GITHUB_WORKSPACE/build/kpi-thesis-coursework-overleaf.zip"
          TEXMFHOME=/nonexistent latexmk -interaction=nonstopmode main.tex
          test -s main.pdf
          grep -q "kpi-thesis.cls" main.log && ! grep -q "texmf/tex/latex/kpi-thesis" main.log
      - name: Overleaf's first compile skips biber (free plan stops after 10 s)
        run: |
          mkdir /tmp/ovl1 && cd /tmp/ovl1 && unzip -q "$GITHUB_WORKSPACE/build/kpi-thesis-coursework-overleaf.zip"
          TEXMFHOME=/nonexistent latexmk -cd -jobname=output -interaction=batchmode -f -lualatex main.tex 2>&1 | tee lmk.txt
          test -s output.pdf
          # A second pass only when luaotfload builds its font cache (first run on a fresh runner).
          test "$(grep -c "Running 'lualatex" lmk.txt)" -le 2 && ! grep -q "Running 'biber" lmk.txt
      - name: CTAN zip holds the package files only
        run: |
          just ctan
          files=$(unzip -Z1 build/kpi-thesis.zip)
          for f in kpi-thesis/README.md kpi-thesis/LICENSE kpi-thesis/kpi-thesis.cls \
                   kpi-thesis/kpi-thesis-dstu.bbx kpi-thesis/kpi-thesis-dstu.cbx \
                   kpi-thesis/doc/kpi-thesis-doc.pdf kpi-thesis/doc/kpi-thesis-doc.tex; do
            echo "$files" | grep -qx "$f" || { echo "missing $f"; exit 1; }
          done
          ! echo "$files" | grep -E '/\.|\.(aux|log|fls|fdb_latexmk|synctex\.gz|out|toc)$'
